name: CI

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check dist/uniUI.luau is up to date
        run: python3 tools/bundle.py --check
